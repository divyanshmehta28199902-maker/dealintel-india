<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 36" fill="none">
  <!-- Icon mark: dark navy box, thin cyan border -->
  <rect x="0.5" y="4.5" width="27" height="27" rx="4" fill="#060D18" stroke="#00D1FF" stroke-opacity="0.30" stroke-width="1"/>

  <!-- Ascending bar chart — bloomberg terminal style -->
  <!-- Short bar (left) -->
  <rect x="5"  y="23" width="5" height="7"  rx="1" fill="#00D1FF" fill-opacity="0.38"/>
  <!-- Medium bar -->
  <rect x="12" y="18" width="5" height="12" rx="1" fill="#00D1FF" fill-opacity="0.68"/>
  <!-- Tall bar (right) -->
  <rect x="19" y="12" width="5" height="18" rx="1" fill="#00D1FF"/>
  <!-- Terminal pulse dot at top of tall bar -->
  <circle cx="21.5" cy="10.5" r="2" fill="#00D1FF"/>

  <!-- Wordmark: DEAL + INTEL on same baseline, INDIA below -->
  <text x="37" y="23"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="0.6"
        fill="#F1F5F9">DEAL</text>

  <text x="74" y="23"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="0.6"
        fill="#00D1FF">INTEL</text>

  <text x="38" y="32"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="7"
        font-weight="500"
        letter-spacing="3.2"
        fill="#374151">INDIA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 36" fill="none">
  <!-- Icon mark: very light box with blue border -->
  <rect x="0.5" y="4.5" width="27" height="27" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-opacity="0.30" stroke-width="1"/>

  <!-- Ascending bar chart — same geometry, blue palette -->
  <rect x="5"  y="23" width="5" height="7"  rx="1" fill="#2563EB" fill-opacity="0.35"/>
  <rect x="12" y="18" width="5" height="12" rx="1" fill="#2563EB" fill-opacity="0.65"/>
  <rect x="19" y="12" width="5" height="18" rx="1" fill="#2563EB"/>
  <circle cx="21.5" cy="10.5" r="2" fill="#2563EB"/>

  <!-- Wordmark: dark text + blue INTEL -->
  <text x="37" y="23"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="0.6"
        fill="#0F172A">DEAL</text>

  <text x="74" y="23"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="0.6"
        fill="#2563EB">INTEL</text>

  <text x="38" y="32"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="7"
        font-weight="500"
        letter-spacing="3.2"
        fill="#94A3B8">INDIA</text>
</svg>
